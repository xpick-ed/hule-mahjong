      /* 程式還在下載時先出現的畫面（React 畫好就換掉） */
      html, body { margin: 0; height: 100%; background: #ffe066; }
      .boot { position: fixed; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; font-family: 'PingFang TC', 'Noto Sans TC', system-ui, sans-serif; }
      .boot b { font-size: 56px; font-weight: 900; color: #ef3d5c; text-shadow: 0 5px 0 #1d2a4a; }
      .boot small { font-size: 14px; font-weight: 700; color: rgba(29, 42, 74, 0.62); animation: boot 1.2s ease-in-out infinite alternate; }
      @keyframes boot { from { opacity: 0.35; } }

  <body>
    <div id="root"><div class="boot"><b>胡了！</b><small>洗牌中…</small></div></div>
