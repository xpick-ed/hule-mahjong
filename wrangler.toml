# Cloudflare Workers 設定（接 GitHub 的 Workers Builds 會跑 npx wrangler deploy，讀這個檔）
# name 要跟 Cloudflare 後台那個 Worker 的名字一樣
name = "hule"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

# deploy 之前先 build 網站（後台沒設 build command 也沒關係）
[build]
command = "npm run build"

# 網站：dist/ 的靜態檔，_headers 裡的快取設定也會用上
[assets]
directory = "./dist"
binding = "ASSETS"

# 每日挑戰排行榜的資料庫（D1，亞太區，2026-09-26 建立）。表格定義在 schema.sql：
#   npx wrangler d1 execute hule --remote --file=schema.sql
# binding 要叫 DB：worker/daily.ts 用 env.DB 讀寫
[[d1_databases]]
binding = "DB"
database_name = "hule"
database_id = "c771b91b-d73b-4f2e-8ab4-ef56024be1c0"

# 連線對打：一個房號一個 Durable Object（免費方案要用 SQLite 版）
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
